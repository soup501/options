services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: options
      POSTGRES_PASSWORD: ${OPTIONS_DB_PASSWORD:?set OPTIONS_DB_PASSWORD in /etc/options.env}
      POSTGRES_DB: options
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - options_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U options -d options"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  options_pgdata:
